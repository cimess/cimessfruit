# Replace friut.cimessinvest.com. Install this HTTP bootstrap, then run certbot --nginx
# to install HTTPS and redirect HTTP. Do not point release apps here before TLS.
limit_req_zone $binary_remote_addr zone=cimess_auth:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name friut.cimessinvest.com;
    client_max_body_size 9m;

    location ~ ^/api/(mobile/(login|signup|exchange)|recovery/|account-deletion/) {
        limit_req zone=cimess_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/cimessfruit-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/cimessfruit-proxy.conf;
    }
}
